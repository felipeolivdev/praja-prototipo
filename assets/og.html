<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>PraJá.studio · imagem de compartilhamento (1200x630)</title>
<!-- Fonte da imagem social. Para regerar og.png: abra no navegador em 1200x630 e capture a tela. -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@700..900&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #F7F5EF; --fg: #15161A; --zap: #F5C518; --muted: #5E5D58; --line: #E3DFD4; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg); color: var(--fg); overflow: hidden; font-family: "Schibsted Grotesk", system-ui, sans-serif; }
  .bg { position: absolute; inset: 0; background:
      linear-gradient(90deg, rgba(21, 22, 26, .05) 1px, transparent 1px) 72px 0 / 48px 100% repeat-x,
      linear-gradient(rgba(21, 22, 26, .05) 1px, transparent 1px) 0 14px / 100% 48px repeat-y; }
  .top { position: absolute; left: 72px; top: 56px; display: flex; align-items: center; gap: 16px; font-weight: 800; font-size: 40px; letter-spacing: -.03em; }
  .top svg { width: 58px; height: 58px; }
  .top em { font-style: normal; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 20px; letter-spacing: 0; color: var(--muted); margin-left: -8px; padding-top: 14px; }
  .chip { position: absolute; right: 72px; top: 70px; display: flex; align-items: center; font-weight: 800; font-size: 26px; color: var(--fg); letter-spacing: -.01em; }
  .chip i { display: none; }
  h1 { position: absolute; left: 72px; top: 160px; font-weight: 800; font-size: 88px; line-height: .98; letter-spacing: -.03em; }
  h1 .mark { position: relative; display: inline-block; z-index: 0; color: var(--fg); padding: 0 .04em; }
  h1 .mark::before { content: ""; position: absolute; inset: .02em -.14em .04em; background: var(--zap); transform: skewX(-8deg); border-radius: 14px; z-index: -1; }
  .foot { position: absolute; left: 72px; bottom: 54px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 22px; color: var(--muted); letter-spacing: .02em; }
  .foot b { color: var(--fg); }
  .tag { position: absolute; right: 72px; bottom: 46px; font-weight: 800; font-size: 30px; padding: 14px 30px; color: var(--bg); isolation: isolate; }
  .tag::before { content: ""; position: absolute; inset: 0; background: var(--fg); transform: skewX(-8deg); border-radius: 12px; z-index: -1; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="top">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#f5c518"/><path d="M23 6 12 22h7l-2 12 11-16h-7z" fill="#15161a"/></svg>
    <span>PraJá</span><em>.studio</em>
  </div>
  <!-- promessa:chip --><div class="chip"><i></i>Seu site no ar em 24 horas</div><!-- /promessa:chip -->
  <!-- promessa:titulo --><h1>Tem uma ideia e<br>medo de gastar<br>meses à toa?<br><span class="mark">É PraJá.</span></h1><!-- /promessa:titulo -->
  <!-- promessa:rodape --><div class="foot"><b>»</b> Para quem quer testar uma ideia &nbsp; <b>»</b> Protótipo fictício</div><!-- /promessa:rodape -->
  <div class="tag">24 horas</div>
</body>
</html>
